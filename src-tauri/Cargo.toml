[package]
name = "tess"
version = "0.7.0-alpha.12"
description = "Fast. Lightweight. Famous. Terminal for the new era."
authors = ["Squitch"]
repository = "https://github.com/SquitchYT/Tess"
edition = "2021"
rust-version = "1.81"
homepage = "https://tessapp.net"
license = "Mozilla Public License 2.0"
categories = ["development-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.4", features = ["protocol-asset", "unstable"] }
portable-pty = "0.8.1"
infer = "0.16.0"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "time",
    "net",
] }
dirs = "6"
uuid = { version = "1.15", features = ["v4", "serde"] }
thiserror = "1.0.50"
lazy_static = "1.4.0"
regex-lite = "0.1.5"
vt100 = "0.15.2"
futures = "0.3.29"
tauri-plugin-clipboard-manager = "2"
bitcode = "0.6.6"
clap = { version = "4.5.35", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.17"
signal-hook-tokio = { version = "0.3.1", features = ["futures-v0_3"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "^0.60.0", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Wdk_System_Threading",
] }
windows-native = "1.0.40"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
